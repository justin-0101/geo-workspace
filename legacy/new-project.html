<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建项目 · GEO 诊断平台</title><style>body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#f5f7f8;color:#243238;margin:0}.wrap{max-width:680px;margin:8vh auto;padding:28px}.card{background:#fff;border:1px solid #e4eaec;border-radius:12px;padding:28px;box-shadow:0 8px 30px #15343d0d}h1{margin:0 0 8px}p{color:#68777b}label{display:block;margin:18px 0 6px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd7da;border-radius:7px;font:inherit}button,a{display:inline-block;margin-top:22px;padding:11px 17px;border-radius:7px;text-decoration:none;font:inherit;cursor:pointer}button{border:0;background:#0d7180;color:#fff}a{border:1px solid #cbd7da;color:#526267;margin-left:8px}.error{color:#b64d4d;margin-top:14px}</style></head>
<body><main class="wrap"><div class="card"><p>GEO 诊断平台 · 新建项目</p><h1>创建一个诊断项目</h1><p>项目创建后会进入独立的新版本工作台，不跳转到原版页面。</p><form id="form"><label for="name">项目名称</label><input id="name" required placeholder="例如：某某企业 GEO 诊断"><label for="type">主体类型</label><select id="type"><option value="enterprise">企业</option><option value="product">产品</option><option value="person">个人</option><option value="case">案例</option></select><div><button>创建并进入工作台</button><a href="projects.html">取消</a></div><div id="error" class="error"></div></form></div></main><script>const API='http://127.0.0.1:8798';document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{const r=await fetch(API+'/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,target_type:document.querySelector('#type').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'项目创建失败');location.href='diagnosis.html?project='+encodeURIComponent(d.slug)}catch(err){error.textContent='项目创建失败：'+err.message+'。请确认后端服务已启动。'}})</script></body></html>
