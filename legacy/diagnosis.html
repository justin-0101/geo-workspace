<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诊断 · GEO 新版工作空间</title><style>body{margin:0;background:#f5f7f8;color:#243238;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top a{color:#176b88;text-decoration:none;margin-left:14px}.card{background:#fff;border:1px solid #e1e9eb;border-radius:12px;padding:22px;margin-bottom:18px}.muted{color:#6f7d81;font-size:13px}.btn{display:inline-block;background:#0d7180;color:#fff;border:0;border-radius:7px;padding:10px 16px;text-decoration:none;cursor:pointer;font:inherit}.btn.secondary{background:#eef5f6;color:#176b88}.status{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;background:#fff1d9;color:#9a6815}.status.good{background:#e5f5e9;color:#287640}.status.bad{background:#fff0f0;color:#b84b4b}.head{display:flex;justify-content:space-between;align-items:center;gap:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f1}.table th{color:#6f7d81;font-weight:600}.result{width:100%;min-width:260px;padding:7px;border:1px solid #ccd9dc;border-radius:5px}.notice{background:#fff8e8;border-left:4px solid #d7a63b;padding:13px;color:#765a20;font-size:13px}</style></head><body><main class="wrap"><header class="top"><div><div class="muted">GEO 新版工作空间</div><h1>诊断中心</h1></div><nav><a href="dashboard.html">工作台</a><a href="projects.html">项目</a><a href="content-production.html">内容生产</a><a href="publication.html">发布</a></nav></header><div id="app"><div class="card">正在读取新版诊断数据……</div></div></main><script>
const API='http://127.0.0.1:8798'; const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'接口请求失败');return d}
async function load(){try{const ps=(await get('/api/projects')).projects;if(!ps.length){app.innerHTML='<section class="card"><h2>还没有新版项目</h2><p class="muted">诊断必须从新版项目开始，原版本数据不会出现在这里。</p><a class="btn" href="new-project.html">创建第一个项目</a></section>';return}const q=new URLSearchParams(location.search),p=ps.find(x=>x.slug===q.get('project'))||ps[0],d=await get('/api/projects/'+encodeURIComponent(p.slug)+'/diagnosis'),r=d.run;app.innerHTML=`<section class="card"><div class="head"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.target_type_label)} · 新版独立诊断批次</p></div><button id="start" class="btn">${r?'开始新一轮诊断':'开始诊断'}</button></div><div class="notice">当前版本会创建冻结诊断任务，并保留人工执行与结果回填；没有真实模型响应时不会伪造“已完成”。默认创建 4 个平台 × 8 道问题。</div></section><section class="card"><div class="head"><div><h2>当前诊断批次</h2><p class="muted">${r?esc(r.run_id)+' · '+esc(r.status):'尚未创建诊断批次'}</p></div><span class="status ${r&&r.state.pending===0?'good':''}">${r?`${r.state.success}/${r.state.total} 已完成`:'未开始'}</span></div>${r?`<div class="table-wrap"><table class="table"><thead><tr><th>平台</th><th>冻结问题</th><th>状态</th><th>人工结果回填</th><th>保存</th></tr></thead><tbody>${r.tasks.map(t=>`<tr><td>${esc(t.platform)}</td><td>${esc(t.question)}</td><td><select class="task-status" data-id="${esc(t.id)}"><option value="pending" ${t.status==='pending'?'selected':''}>待执行</option><option value="completed" ${t.status==='completed'?'selected':''}>已完成</option><option value="failed" ${t.status==='failed'?'selected':''}>失败</option><option value="skipped" ${t.status==='skipped'?'selected':''}>跳过</option></select></td><td><input class="result" data-result="${esc(t.id)}" value="${esc(t.result||'')}" placeholder="粘贴人工观察结果或证据链接"></td><td><button class="btn secondary save" data-id="${esc(t.id)}">保存</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">点击“开始诊断”创建一轮新的冻结任务。</p>'}</section>`;document.querySelector('#start').onclick=async()=>{try{await get('/api/projects/'+encodeURIComponent(p.slug)+'/diagnosis/start',{method:'POST',body:JSON.stringify({})});load()}catch(e){app.insertAdjacentHTML('afterbegin',`<section class="card"><p class="status bad">诊断启动失败：${esc(e.message)}</p></section>`)}};document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,status=document.querySelector(`[data-id="${CSS.escape(id)}"]`).value,result=document.querySelector(`[data-result="${CSS.escape(id)}"]`).value;try{await get('/api/projects/'+encodeURIComponent(p.slug)+'/diagnosis/tasks/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({status,result})});b.textContent='已保存'}catch(e){b.textContent='失败：'+e.message}})}catch(e){app.innerHTML=`<section class="card"><p class="status bad">诊断加载失败：${esc(e.message)}</p><p class="muted">请确认新版服务已启动：127.0.0.1:8798。</p></section>`}}load();
</script></body></html>
